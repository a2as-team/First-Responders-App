manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: johanfortus/first-responders-app
    source: https://github.com/johanfortus/first-responders-app
    branch: main
    commit: "136ef20b"
    scope: [Agents/first_responder_agent/agent.py, Agents/first_responder_agent/utils.py, Backend/app.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:43:22Z'
    url: https://a2as.org/certified/agents/johanfortus/first-responders-app
  signatures:
    digest: sha256:0ozZNkuX1NTqgRXb-MYQMZ7SpICv3XPVWUJDZhtzzSI
    key: ed25519:PzyS4u_XIsVen_wgVARIB3Ygsi2y4IICWA3Usn0j2j0
    sig: ed25519:GqMnxyatvCNVlIMRa-RYT-yqehMc0vedbfUQ85jo5ZpsepHvKT381nPTgH7tKezji8vGCxGOW4ZnadaI4DIYBA

agents:
  root_agent:
    type: instance
    models: [gemini-2.0-flash]
    tools: [analyze_call_and_update_wellness, push_notification_based_on_severity]
    params:
      name: first_responder_call_analyzer
      description: AI agent for analyzing emergency calls and pushing severity-based notifications to first responders.
      instruction: ['I am a specialized agent for first responder call analysis and notification management. I have two main
          functions:', '1. **Call Analysis**: I analyze 911/dispatch call transcripts to calculate severity scores (1-100),
          store call records, update user call arrays, and recalculate wellness scores for all involved responders.', '2.
          **Severity Notifications**: I push appropriate notifications to users based on severity score thresholds:', '- Critical
          (80-100): High-priority notifications encouraging immediate support', '- Warning (60-79): Medium-priority notifications
          with support reminders', '- Reminder (40-59): Low-priority check-in reminders', '- No notification for scores below
          40', I work directly with the Flask backend to update database records and manage the notification system.]

models:
  gemini-2.0-flash:
    type: literal
    agents: [root_agent]

tools:
  analyze_call_and_update_wellness:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Analyze emergency call, calculate severity score, update user call arrays, and recalculate wellness scores.

        Args:
            transcript: Audio transcript from 911/dispatch call
            call_id: Unique integer call ID that ties to calls table
            user_id: String user ID who responded to this call

        Returns:
            dict: Results including call_id, severity_score, and updated wellness scores
  push_notification_based_on_severity:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Push notification to user based on severity score monitoring.

        Args:
            user_id: User ID to send notification to
            severity_score: Severity score (1-100) that triggered the notification

        Returns:
            dict: Results of notification push attempt

imports:
  agent: agent
  Agent: google.adk.agents.Agent
  analyze_call_and_update_wellness: Agents.first_responder_agent.agent.analyze_call_and_update_wellness
  calculate_severity_score: utils.calculate_severity_score
  calculate_wellness_scores: utils.calculate_wellness_scores
  certifi: certifi
  datetime: datetime.datetime
  Dict: typing.Dict
  Flask: flask.Flask
  GenerativeModel: vertexai.generative_models.GenerativeModel
  json: json
  jsonify: flask.jsonify
  List: typing.List
  load_config: utils.load_config
  load_dotenv: dotenv.load_dotenv
  logging: logging
  MongoClient: pymongo.MongoClient
  Optional: typing.Optional
  os: os
  push_notification_based_on_severity: Agents.first_responder_agent.agent.push_notification_based_on_severity
  re: re
  request: flask.request
  requests: requests
  send_to_backend: utils.send_to_backend
  sys: sys
  threading: threading
  time: time
  timedelta: datetime.timedelta
  update_user_wellness_scores: utils.update_user_wellness_scores
  vertexai: vertexai

functions:
  add_call:
    type: sync
    module: Backend.app
  analyze_call:
    type: sync
    module: Backend.app
  analyze_call_and_update_wellness:
    type: sync
    module: Agents.first_responder_agent.agent
    args: [transcript, call_id, user_id]
    params:
      returns: dict
  calculate_severity_score:
    type: sync
    module: Agents.first_responder_agent.utils
    args: [transcript, user_id, config]
    params:
      returns: int
  calculate_wellness_from_severity:
    type: sync
    module: Agents.first_responder_agent.utils
    args: [severities]
    params:
      returns: int
  calculate_wellness_scores:
    type: sync
    module: Agents.first_responder_agent.utils
    args: [user_id, new_call_severity]
    params:
      returns: Dict
  chat_with_gemini:
    type: sync
    module: Backend.app
  delayed_trigger:
    type: sync
    module: Agents.first_responder_agent.agent
  get_user_calls_for_agent:
    type: sync
    module: Backend.app
    args: [user_id]
  home:
    type: sync
    module: Backend.app
  load_config:
    type: sync
    module: Agents.first_responder_agent.utils
    params:
      returns: Dict
  load_threshold_config:
    type: sync
    module: Backend.app
  push_notification:
    type: sync
    module: Backend.app
  push_notification_based_on_severity:
    type: sync
    module: Agents.first_responder_agent.agent
    args: [user_id, severity_score]
    params:
      returns: dict
  put_call:
    type: sync
    module: Backend.app
    args: [userID]
  send_notification_endpoint:
    type: sync
    module: Backend.app
  send_to_backend:
    type: sync
    module: Agents.first_responder_agent.utils
    args: [endpoint, data, backend_url, method]
    params:
      returns: Dict
  trigger_chat_after_delay:
    type: sync
    module: Agents.first_responder_agent.agent
    args: [user_id, call_id, severity_score, delay_seconds]
  update_user_wellness_scores:
    type: sync
    module: Agents.first_responder_agent.utils
    args: [user_id, wellness_scores]
    params:
      returns: Dict

variables:
  API_AUTH_TOKEN:
    type: env
    params:
      caller: [os.getenv]
      path: [Agents.first_responder_agent.utils]
  FLASK_DEBUG:
    type: env
    params:
      caller: [os.getenv]
      path: [Backend.app]
  GOOGLE_CLOUD_LOCATION:
    type: env
    params:
      caller: [os.getenv]
      path: [Agents.first_responder_agent.utils]
  GOOGLE_CLOUD_PROJECT:
    type: env
    params:
      caller: [os.getenv]
      path: [Agents.first_responder_agent.utils]
  MONGO_URI:
    type: env
    params:
      caller: [os.getenv]
      path: [Backend.app]

files:
  .env:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [agent_dir, .env]
  config.json:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [parent_dir, Agents, first_responder_agent, config.json]
  config_path:
    type: variable
    actions: [read]
    params:
      caller: [open, json.load]
      alias: [f]
